[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tagscope"
dynamic = ["version"]
description = "Log OPC UA tags to SQLite or PostgreSQL and watch them live in a fast, modern web dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dan Shinde" }]
keywords = ["opc-ua", "opcua", "historian", "scada", "plc", "industrial", "iiot", "data-logger", "siemens", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "asyncua>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "build"]

[project.scripts]
tagscope = "tagscope.cli:main"

[project.urls]
Homepage = "https://github.com/DanShinde/tagscope"
Issues = "https://github.com/DanShinde/tagscope/issues"
Changelog = "https://github.com/DanShinde/tagscope/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/tagscope/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["SIM105"]
