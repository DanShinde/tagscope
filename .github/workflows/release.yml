name: Release

# Run this workflow from the Actions tab ("Run workflow"), push a tag like v0.1.0,
# or publish a GitHub release. It builds, uploads to PyPI and (for manual runs and
# tags) creates the GitHub release vX.Y.Z with the built files attached.
# PyPI side: a "trusted publisher" for this repository (workflow: release.yml,
# environment: pypi). No API token needed.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(grep -Po '(?<=__version__ = ")[^"]+' src/tagscope/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
